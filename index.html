<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">

<title>Certificado · Best of Ten</title>
<!--
  Página del certificado de Best of Ten. Es UN solo archivo estático, sin
  servidor ni base de datos: todos los datos de la nota vienen dentro del
  enlace del QR, después del «#». El navegador nunca envía esa parte al
  servidor, así que el sitio donde se publique esta página no recibe ni ve
  ninguna nota, foto ni dato del usuario. Tampoco carga nada de terceros.
-->
<style>
:root{
  --bg:#14141e; --bg2:#1c1b29; --panel:#201e2e; --line:rgba(255,255,255,.09);
  --ink:#f4eef0; --muted:#b4a9b3; --dim:#7f7584;
  --crimson:#831b34; --accent:#ef4d6f; --accent2:#f9737e; --wine:#4e1226;
  --gold:#d7a666; --gold2:#f6d294; --bronze:#b37d45; --ok:#5fd39a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% -10%,#3a1022 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:4px 0 22px}
header img{width:44px;height:44px;border-radius:50%}
.brand{font-family:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.06em;
  color:var(--gold2);font-size:21px;line-height:1.1}
.brand small{display:block;font-family:inherit;font-size:11px;letter-spacing:.22em;color:var(--dim);font-weight:600}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;
  overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.label{position:relative;padding:20px 20px 18px;background:linear-gradient(180deg,#fdfaf7,#efe6e1);color:#1d1218;
  border-bottom:3px solid var(--crimson)}
.label.black{background:linear-gradient(180deg,#1d1a20,#060607);color:var(--gold2);border-bottom-color:var(--gold)}
.label .wm{position:absolute;right:14px;top:50%;width:110px;height:110px;transform:translateY(-50%);opacity:.08;
  pointer-events:none}
.label.black .wm{opacity:.16}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative}
.cname{font-weight:800;font-size:22px;line-height:1.2;word-break:break-word}
.cset{margin-top:4px;font-size:14px;color:#6d5560}
.label.black .cset{color:var(--gold)}
.gradebox{text-align:center;min-width:86px}
.gnum{font-family:"Cinzel",Georgia,serif;font-weight:800;font-size:46px;line-height:1;color:var(--crimson)}
.label.black .gnum{background:linear-gradient(180deg,#fff1c9,var(--gold2) 40%,var(--gold) 70%,var(--bronze));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.gname{font-size:12px;font-weight:800;letter-spacing:.12em;margin-top:4px}
.badge{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;
  letter-spacing:.14em;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#140d08}
.body{padding:18px 20px 20px}
h2{font-size:12px;letter-spacing:.18em;color:var(--gold);margin:0 0 12px;font-weight:700}
.sub{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;margin:9px 0}
.sub span{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--crimson),var(--accent),var(--accent2))}
.bar i.max{background:linear-gradient(90deg,var(--bronze),var(--gold),var(--gold2))}
.sub b{text-align:right;font-variant-numeric:tabular-nums}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.meta div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meta small{display:block;color:var(--dim);font-size:11px;letter-spacing:.12em;font-weight:700}
.meta strong{font-size:15px;font-variant-numeric:tabular-nums;word-break:break-all}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;
  border:1px solid rgba(95,211,154,.35);background:rgba(95,211,154,.08);font-size:14px}
.check.bad{border-color:rgba(239,77,111,.45);background:rgba(239,77,111,.1)}
.check .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;
  background:var(--ok);color:#06140d}
.check.bad .ic{background:var(--accent);color:#fff}
.note{margin-top:18px;color:var(--dim);font-size:12.5px;line-height:1.55}
.empty{text-align:center;padding:40px 22px}
.empty img{width:96px;height:96px;border-radius:50%;margin-bottom:14px}
.empty h1{font-family:"Cinzel",Georgia,serif;color:var(--gold2);font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0}
h2.sp{margin-top:22px}
.meta .cl{display:block;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:pre}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photos figure{margin:0;cursor:zoom-in}
.photos img{width:100%;border-radius:10px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.photos figcaption{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;text-transform:capitalize}
.det{margin:0;padding-left:18px;color:var(--ink);font-size:14.5px}
.det li{margin:6px 0}
.det li.minor{color:var(--muted);font-size:13px}
.zoom{position:fixed;inset:0;background:rgba(8,8,12,.92);display:grid;place-items:center;padding:16px;z-index:9;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}
footer{margin-top:18px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>

  var NAMES = {100:"GEM MINT",95:"MINT+",90:"MINT",85:"NM-MT+",80:"NM-MT",75:"NM+",70:"NM",65:"EX-MT+",60:"EX-MT",
    55:"EX+",50:"EX",45:"VG-EX+",40:"VG-EX",35:"VG+",30:"VG",25:"G+",20:"GOOD",15:"FAIR",10:"POOR"};
  var SUBS = [["Centrado"],["Esquinas"],["Bordes"],["Superficie"]];
  var app = document.getElementById("app");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;   // siempre como texto, nunca como HTML
    return e;
  }
  function fmt(v) { return v == null ? "—" : (Math.round(v * 10) / 10).toString().replace(".", ","); }

  function empty(title, msg) {
    var d = el("div", "empty");
    var i = el("img"); i.src = LOGO; i.alt = ""; d.appendChild(i);
    d.appendChild(el("h1", null, title)); d.appendChild(el("p", null, msg));
    app.appendChild(d);
  }

  // Formato 2: v~cert~nombre~número~notas~AAMMDD~código
  // Formato 3: v~cert~nombre~número~notas~AAMMDD~centrado~código   (todo después del «#»)
  function parse(h) {
    var f = h.replace(/^#/, "").split("~").map(function (x) { return decodeURIComponent(x); });
    var n = f[0] === "3" ? 8 : (f[0] === "2" ? 7 : 0);
    if (!n || f.length !== n || f[4].length !== 5) return null;
    var G = "0123456789abcdefghijk";
    function g(ch) { var i = G.indexOf(ch); return i < 0 ? null : i / 2; }
    var d = f[5], cen = null;
    if (n === 8 && /^[0-9x]{8}$/.test(f[6])) {
      cen = {};
      [["Frente", 0], ["Reverso", 4]].forEach(function (s) {
        var q = f[6].slice(s[1], s[1] + 4);
        if (/^\d{4}$/.test(q)) {
          var l = +q.slice(0, 2), t = +q.slice(2, 4);
          cen[s[0]] = [l + "/" + (100 - l), t + "/" + (100 - t)];
        }
      });
    }
    return { raw: f, cert: "BOT-" + ("000000" + f[1]).slice(-6), name: f[2], number: f[3],
      grade: g(f[4][0]), subs: [g(f[4][1]), g(f[4][2]), g(f[4][3]), g(f[4][4])],
      date: d.length === 6 ? d.slice(4, 6) + "/" + d.slice(2, 4) + "/20" + d.slice(0, 2) : "",
      centering: cen, code: f[n - 1].toUpperCase() };
  }

  function sha6(text) {
    if (!(window.crypto && crypto.subtle)) return Promise.resolve(null);
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("").slice(0, 6).toUpperCase();
    });
  }

  if (!location.hash || location.hash.length < 2) {
    empty("Certificado de Best of Ten", "Escanea el QR de la etiqueta trasera de un slab de Best of Ten para ver aquí su certificado.");
    return;
  }
  var c;
  try { c = parse(location.hash); } catch (e) { c = null; }
  if (!c) {
    empty("Código no válido", "Este enlace no corresponde a un certificado de Best of Ten o está incompleto.");
    return;
  }
  var cert = c.cert, name = c.name, number = c.number, set = "", grade = c.grade, date = c.date, code = c.code;
  var subs = SUBS.map(function (s, i) { return [s[0], c.subs[i]]; });
  var perfect = grade === 10 && subs.every(function (s) { return s[1] === 10; });
  document.title = name + " · " + fmt(grade) + " · Best of Ten";

  var lab = el("section", "label" + (perfect ? " black" : ""));
  var wm = el("img", "wm"); wm.src = perfect ? GOLD : LOGO; wm.alt = ""; lab.appendChild(wm);
  var row = el("div", "row");
  var left = el("div");
  left.appendChild(el("div", "cname", name));
  if (number) left.appendChild(el("div", "cset", "#" + number));
  if (perfect) left.appendChild(el("span", "badge", "BLACK LABEL"));
  row.appendChild(left);
  var gb = el("div", "gradebox");
  gb.appendChild(el("div", "gnum", fmt(grade)));
  gb.appendChild(el("div", "gname", grade == null ? "" : (NAMES[Math.round(grade * 10)] || "")));
  row.appendChild(gb);
  lab.appendChild(row);
  app.appendChild(lab);

  var body = el("section", "body");
  body.appendChild(el("h2", null, "SUBGRADOS"));
  subs.forEach(function (s) {
    var r = el("div", "sub");
    r.appendChild(el("span", null, s[0]));
    var bar = el("div", "bar"), fill = el("i", s[1] === 10 ? "max" : "");
    fill.style.width = (s[1] == null ? 0 : Math.max(4, s[1] * 10)) + "%";
    bar.appendChild(fill); r.appendChild(bar);
    r.appendChild(el("b", null, fmt(s[1])));
    body.appendChild(r);
  });

  var meta = el("div", "meta");
  [["CERTIFICADO", cert], ["FECHA", date], ["VERIFICACIÓN", code], ["CASA", "Best of Ten"]].forEach(function (m) {
    var d = el("div"); d.appendChild(el("small", null, m[0])); d.appendChild(el("strong", null, m[1] || "—"));
    meta.appendChild(d);
  });
  body.appendChild(meta);

  if (c.centering && Object.keys(c.centering).length) {
    body.appendChild(el("h2", "sp", "CENTRADO"));
    var ct = el("div", "meta");
    Object.keys(c.centering).forEach(function (k) {
      var d = el("div"); d.appendChild(el("small", null, k.toUpperCase()));
      d.appendChild(el("span", "cl", "Izq / Der  " + c.centering[k][0]));
      d.appendChild(el("span", "cl", "Arr / Aba  " + c.centering[k][1]));
      ct.appendChild(d);
    });
    body.appendChild(ct);
  }
  var full = el("div"); body.appendChild(full);

  var chk = el("div", "check");
  var ic = el("div", "ic", "…"), txt = el("div", null, "Comprobando el código…");
  chk.appendChild(ic); chk.appendChild(txt); body.appendChild(chk);
  sha6(c.raw.slice(0, c.raw.length - 1).join("|")).then(function (h) {
    if (h === null) {
      ic.textContent = "?";
      txt.textContent = "Este navegador no puede comprobar el código. Compara " + code + " con el impreso en la etiqueta.";
    } else if (h === code) {
      ic.textContent = "✓";
      txt.textContent = "El código " + code + " coincide con estas notas. Compáralo con el impreso en la etiqueta del slab: si es el mismo, la nota no fue cambiada.";
      loadFull();
    } else {
      chk.className = "check bad"; ic.textContent = "!";
      txt.textContent = "Las notas de este enlace fueron cambiadas: el código no coincide.";
    }
  });

  // Certificado completo (opcional): <cert>-<código>.json junto a esta página, con fotos y detalle.
  function img(src, alt) {
    if (typeof src !== "string" || !/^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(src)) return null;
    var i = el("img"); i.src = src; i.alt = alt; return i;
  }
  function loadFull() {
    if (location.protocol !== "https:" && location.protocol !== "http:") return;
    fetch(encodeURIComponent(cert + "-" + code) + ".json", { cache: "no-store", credentials: "omit" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || j.codigo !== code || j.cert !== cert) return;
        var fotos = j.fotos || {};
        var keys = ["frente", "reverso"].filter(function (k) { return fotos[k]; });
        if (keys.length) {
          full.appendChild(el("h2", "sp", "FOTOS DE LA CARTA"));
          var g = el("div", "photos");
          keys.forEach(function (k) {
            var i = img(fotos[k], k); if (!i) return;
            var fig = el("figure"); fig.appendChild(i); fig.appendChild(el("figcaption", null, k));
            fig.addEventListener("click", function () { zoom(fotos[k]); });
            g.appendChild(fig);
          });
          full.appendChild(g);
        }
        var eq = j.equivalencias || {};
        if (Object.keys(eq).length) {
          full.appendChild(el("h2", "sp", "EQUIVALENCIA APROXIMADA"));
          var m = el("div", "meta");
          Object.keys(eq).forEach(function (k) {
            var d = el("div"); d.appendChild(el("small", null, k));
            d.appendChild(el("strong", null, (eq[k].nota != null ? fmt(eq[k].nota) + " " : "") + (eq[k].nombre || "")));
            m.appendChild(d);
          });
          full.appendChild(m);
        }
        full.appendChild(el("h2", "sp", "DETALLE"));
        var list = el("ul", "det");
        var defs = Array.isArray(j.defectos) ? j.defectos : [];
        if (!defs.length) list.appendChild(el("li", null, "Sin defectos de superficie detectados."));
        defs.slice(0, 12).forEach(function (d) {
          list.appendChild(el("li", null, (d.tipo || "marca") + " en el " + (d.cara || "") + ", " + (d.donde || "") +
            (d.tamano_mm ? " (~" + d.tamano_mm + " mm)" : "")));
        });
        if (j.rango && j.rango.length === 2 && j.rango[0] !== j.rango[1])
          list.appendChild(el("li", null, "Rango probable de la nota: " + fmt(j.rango[0]) + " a " + fmt(j.rango[1]) + "."));
        if (j.confianza != null) list.appendChild(el("li", null, "Confianza del análisis: " + j.confianza + "%."));
        (Array.isArray(j.confianza_notas) ? j.confianza_notas : []).slice(0, 4).forEach(function (n) {
          list.appendChild(el("li", "minor", String(n)));
        });
        full.appendChild(list);
        if (j.carta && j.carta.set) {
          var cs = document.querySelector(".cset");
          if (cs) cs.textContent = [j.carta.set, number ? "#" + number : ""].filter(Boolean).join(" · ");
        }
      })
      .catch(function () {});
  }
  function zoom(src) {
    var o = el("div", "zoom"), i = img(src, ""); if (!i) return;
    o.appendChild(i); o.addEventListener("click", function () { o.remove(); });
    document.body.appendChild(o);
  }

  body.appendChild(el("p", "note",
    "Pre-gradeo virtual hecho con la app Best of Ten a partir de fotos del usuario. No es un grado oficial ni " +
    "reemplaza el de una casa de gradeo. El arte de la carta pertenece a sus autores y titulares. Best of Ten no " +
    "está afiliado a Nintendo, The Pokémon Company ni a ninguna casa de gradeo. Esta página no guarda ni envía " +
    "datos: la nota viene dentro del propio enlace, y las fotos, si las hay, las publicó el dueño de la carta."));
  app.appendChild(body);
})();
